rules:
- id: csharp-cert-validation-disabled
  languages:
    - csharp
  message: Certificate validation callback disabled.
  severity: WARNING
  patterns:
    - pattern: |
        $HANDLER.ServerCertificateCustomValidationCallback =
          (...) => true;
    - metavariable-type:
        metavariable: $HANDLER
        type: HttpClientHandler